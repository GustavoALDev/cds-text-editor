<form
  class="rte-dialog__form"
  [formRoot]="form"
  (mousedown)="keepFocus($event)"
>
  @let authorError = error(form.author);
  <div class="rte-dialog__field">
    <label class="rte-dialog__label" [for]="ids().author"
      >{{ labels().quoteAuthor }}</label
    >
    <input
      class="rte-dialog__input"
      type="text"
      [id]="ids().author"
      [formField]="form.author"
      [attr.aria-invalid]="authorError ? 'true' : null"
      [attr.aria-describedby]="authorError ? ids().author + '-error' : null"
    />
    @if (authorError) {
    <p class="rte-dialog__error" [id]="ids().author + '-error'">
      {{ authorError }}
    </p>
    }
  </div>
  @let roleError = error(form.role);
  <div class="rte-dialog__field">
    <label class="rte-dialog__label" [for]="ids().role"
      >{{ labels().quoteRole }}</label
    >
    <input
      class="rte-dialog__input"
      type="text"
      [id]="ids().role"
      [formField]="form.role"
      [attr.aria-invalid]="roleError ? 'true' : null"
      [attr.aria-describedby]="roleError ? ids().role + '-error' : null"
    />
    @if (roleError) {
    <p class="rte-dialog__error" [id]="ids().role + '-error'">
      {{ roleError }}
    </p>
    }
  </div>
  <div class="rte-dialog__actions">
    <button type="button" class="rte-dialog__cancel" (click)="cancel()">
      {{ labels().cancel }}
    </button>
    <button type="submit" class="rte-dialog__apply">
      {{ labels().apply }}
    </button>
  </div>
</form>
