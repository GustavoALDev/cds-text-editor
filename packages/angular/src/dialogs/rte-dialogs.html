<dialog
  #dialog
  class="rte-dialog"
  [attr.aria-labelledby]="ids.title"
  (close)="onClose()"
>
  <h2 class="rte-dialog__title" [id]="ids.title">{{ title() }}</h2>
  @switch (active()?.kind) { @case ('link') {
  <rte-link-form
    [request]="active()!"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
    [linkPolicy]="linkPolicy()"
  />
  } @case ('lang') {
  <rte-lang-form
    [request]="active()!"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
    [langRule]="langRule()"
  />
  } @case ('quoteAuthor') {
  <rte-quote-form
    [request]="active()!"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
  />
  } @case ('table') {
  <rte-table-form
    [request]="active()!"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
  />
  } }
</dialog>
