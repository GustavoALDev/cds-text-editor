<dialog
  #dialog
  class="rte-dialog"
  [attr.aria-labelledby]="ids.title"
  (close)="onClose()"
>
  <h2 class="rte-dialog__title" [id]="ids.title">{{ title() }}</h2>
  @switch (active()?.kind) { @case ('quoteAuthor') {
  <form class="rte-dialog__form" [formRoot]="quoteForm">
    @let authorError = errorOf(quoteForm.author);
    <div class="rte-dialog__field">
      <label class="rte-dialog__label" [for]="ids.quoteAuthor"
        >{{ labels().quoteAuthor }}</label
      >
      <input
        class="rte-dialog__input"
        type="text"
        [id]="ids.quoteAuthor"
        [formField]="quoteForm.author"
        [attr.aria-invalid]="authorError ? 'true' : null"
        [attr.aria-describedby]="authorError ? ids.quoteAuthor + '-error' : null"
      />
      @if (authorError) {
      <p class="rte-dialog__error" [id]="ids.quoteAuthor + '-error'">
        {{ authorError }}
      </p>
      }
    </div>
    @let roleError = errorOf(quoteForm.role);
    <div class="rte-dialog__field">
      <label class="rte-dialog__label" [for]="ids.quoteRole"
        >{{ labels().quoteRole }}</label
      >
      <input
        class="rte-dialog__input"
        type="text"
        [id]="ids.quoteRole"
        [formField]="quoteForm.role"
        [attr.aria-invalid]="roleError ? 'true' : null"
        [attr.aria-describedby]="roleError ? ids.quoteRole + '-error' : null"
      />
      @if (roleError) {
      <p class="rte-dialog__error" [id]="ids.quoteRole + '-error'">
        {{ roleError }}
      </p>
      }
    </div>
    <div class="rte-dialog__actions">
      <button type="button" class="rte-dialog__cancel" (click)="cancel()">
        {{ labels().cancel }}
      </button>
      <button type="submit" class="rte-dialog__apply">
        {{ labels().apply }}
      </button>
    </div>
  </form>
  } }
</dialog>
