<dialog
  #dialog
  class="rte-dialog"
  [attr.aria-labelledby]="ids.title"
  (close)="onClose()"
>
  <h2 class="rte-dialog__title" [id]="ids.title">{{ title() }}</h2>
  @if (active(); as req) { @switch (req.kind) { @case ('link') {
  <rte-link-form
    [request]="req"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
    [linkPolicy]="linkPolicy()"
  />
  } @case ('lang') {
  <rte-lang-form
    [request]="req"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
    [langRule]="langRule()"
  />
  } @case ('quoteAuthor') {
  <rte-quote-form
    [request]="req"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
  />
  } @case ('table') {
  <rte-table-form
    [request]="req"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
  />
  } } @defer (when isMediaKind(req.kind); prefetch on idle) {
  <rte-media-forms
    [request]="req"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
    [mediaRules]="mediaRules()"
    [embedProviders]="embedProviders()"
    [alignNames]="alignNames()"
    (ready)="mediaReady.set(true)"
  />
  } @placeholder {} @error {
  <ng-template [rteDeferFailed]="onMediaFailed" />
  } }
</dialog>
