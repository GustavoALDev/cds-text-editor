<dialog
  #dialog
  class="rte-dialog"
  [attr.aria-labelledby]="ids.title"
  (close)="onClose()"
>
  <h2 class="rte-dialog__title" [id]="ids.title">{{ title() }}</h2>
  @if (active(); as req) { @switch (req.kind) { @case ('link') {
  <rte-link-form
    [request]="req"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
    [linkPolicy]="linkPolicy()"
  />
  } @case ('lang') {
  <rte-lang-form
    [request]="req"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
    [langRule]="langRule()"
  />
  } @case ('quoteAuthor') {
  <rte-quote-form
    [request]="req"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
  />
  } @case ('table') {
  <rte-table-form
    [request]="req"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
  />
  } @case ('image') {
  <rte-image-form
    [request]="req"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
    [rule]="mediaRules()?.imageSrc ?? null"
    [alignNames]="alignNames()"
  />
  } @case ('video') {
  <rte-video-form
    [request]="req"
    [controller]="controller()"
    [labels]="labels()"
    [idPrefix]="prefix"
    [rules]="mediaRules()"
  />
  } } }
</dialog>
