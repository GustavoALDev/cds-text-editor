<div class="rte-editor__frame">
  @if (toolbarGroups().length) {
  <rte-toolbar
    [editor]="editor()"
    [version]="version"
    [groups]="toolbarGroups()"
    [interactive]="interactive()"
    [labels]="resolvedLabels().toolbar"
    [calloutTitles]="contentLabels().calloutTitles"
    [palette]="palette()"
    [codeLanguages]="codeLanguages()"
    (escape)="focus()"
    (tabOut)="focus()"
    (dialog)="requestDialog($event.kind, $event.origin)"
  />
  } @if (!editor()) {
  <div
    class="rte-content rte-editor__shell"
    role="textbox"
    aria-multiline="true"
    aria-readonly="true"
    aria-busy="true"
    [attr.aria-label]="shellLabel()"
    [attr.aria-labelledby]="shellLabelledBy()"
  >
    @if (showShellPlaceholder()) {
    <p
      class="rte-placeholder rte-placeholder--doc"
      [attr.data-placeholder]="placeholder()"
    ></p>
    }
  </div>
  }
  <div #mount class="rte-editor__mount"></div>
</div>
@defer (when dialogRequested(); prefetch on idle) {
<rte-dialogs
  [controller]="dialogs"
  [labels]="resolvedLabels().dialogs"
  [linkPolicy]="linkPolicy()"
  [langRule]="langRule()"
/>
} @placeholder {} @error {
<ng-template [rteDeferFailed]="onDialogsFailed" />
}
