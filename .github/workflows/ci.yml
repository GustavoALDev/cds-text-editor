name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # nrwl/nx-set-shas consulta execuções anteriores do workflow.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Matriz de versões (spec 08a): no PR roda só latest×latest (bloqueante); a matriz completa fica
  # no compat.yml (semanal, push em main e disparo manual). O check aparece como
  # `compat / compat (latest×latest)` (nome do job chamador antes do nome da perna).
  compat:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/compat.yml
    with:
      set: pr

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # nx-set-shas e o `nx affected` precisam do histórico completo.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      # Salvaguarda: o repositório exige npm >= 11 (engines + engine-strict), independente do Node do runner.
      - run: npm i -g npm@11
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # PR: base = merge-base com main. Push em main: base = último commit com CI verde;
      # sem execução anterior bem-sucedida, cai em HEAD~1 (não pula nem quebra).
      - uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main
      # Verificações do repositório: rodam sempre, independem do `affected`.
      - run: npm run check:rules
      # `changeset status` usa a base "main"; o checkout de PR é detached e não tem main local.
      - name: Cria o main local
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - run: npm run release-plan
      # Guarda de API (spec 09c, AP9): relatório de API/CSS/esquema que muda exige changeset do tipo certo.
      # Só em PR (precisa da base); `fetch-depth: 0` acima traz o histórico para o `git diff base...HEAD`.
      - name: Guarda de mudança de API (api-diff)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run api-diff -- --base "origin/$BASE_REF"
      - run: npm run test:tools
      - run: npm run test:examples
      - name: THIRD-PARTY-NOTICES.md em dia
        run: |
          npm run notices
          git diff --exit-code THIRD-PARTY-NOTICES.md
      # `typecheck` cobre os testes dos pacotes tsup (Vitest não checa tipos); `build` cobre o código.
      # `coverage` roda a suíte unitária (zoneless) uma vez, no lugar do `test`, e gera os
      # relatórios de cobertura (spec 08a, X10; informativo, sem limiar).
      - run: npx nx affected -t lint typecheck build coverage test-zone verify-package api size --parallel=3
      # Os testes de tempo e de fuzz (sanitizer e render: limits, perf, timed, fuzz) ficam fora do `coverage`
      # (a instrumentação v8 os torna lentos demais); rodam aqui, sem cobertura, pelo alvo `test-timed`.
      - run: npx nx affected -t test-timed
      # Completa os relatórios de cobertura e de tamanho dos pacotes não afetados (vêm do cache do Nx),
      # para o resumo e o artefato `quality-reports` terem sempre os cinco pacotes.
      - run: npx nx run-many -t coverage size --parallel=3
      # Depois do build: lê também as `dependencies` dos manifestos em dist/packages/* (ex.: tslib).
      - run: npm run check:licenses
      - name: npm audit (dependências de runtime, bloqueante)
        run: npm run audit
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps
      # CI=1: repórter `json` em e2e/test-results/report.json (testes instáveis) e retentativas.
      # FC_RUNS=100: as propriedades do tema (e2e/theme/property.spec.ts) custam ~1,5 s por execução e
      # por motor; o padrão local é 200 e quem quiser mais roda com FC_RUNS=1000.
      # O N45 sai desta execução (paralela, ruidosa) e roda isolado no passo seguinte.
      - run: npx playwright test -c e2e --grep-invert "N45"
        env:
          CI: '1'
          FC_RUNS: '100'
      # N45 nas mesmas condições da baseline (perf-baseline.yml): 1 worker, sem retentativa. Pasta de
      # saída à parte para não apagar o report.json e as versões da execução geral.
      - name: Desempenho (N45 isolado)
        run: npx playwright test -c e2e e2e/angular/editor-perf-budget.spec.ts --workers=1 --retries=0 --reporter=list --output=e2e/test-results-n45
        env:
          CI: '1'
          # o servidor do passo anterior pode seguir no ar (filho do nx); reaproveita em vez de falhar
          # com "already used" (mesmo caso do perf-baseline.yml)
          RTE_E2E_REUSE_SERVER: '1'
      # Portão de desempenho (spec 08b, O12): N45 x baseline do CI Linux. Regressão (Δ > max(10%, 3·CV)
      # e >= 2 ms nas duas voltas) é AVISO; RTE_PERF_GATE_ENFORCE=1 a torna bloqueante. Informativo sem
      # baseline ou com motor/CPU diferentes. Roda antes do resumo.
      - name: Desempenho (perf-gate)
        if: always()
        run: node tools/perf-gate.mjs
      # Resumo do job (tamanho x orçamento, cobertura, testes instáveis, N45) e avisos de flakes.
      # Pisos de cobertura por pacote (O13, tools/coverage-floor.json): abaixo do piso o passo sai com 1.
      - name: Resumo de qualidade
        if: always()
        run: node tools/quality-summary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            coverage/packages/
            dist/reports/size/
            e2e/test-results/report.json
            e2e/test-results/perf/
            e2e/test-results/browsers/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  # Regressão visual (spec 08b, O1–O5): captura por elemento no contêiner oficial do Playwright
  # (tag = versão exata do @playwright/test; conferida por tools/visual-image.test.mjs). Roda em todo
  # PR (CSS atravessa pacotes; o `affected` não enxerga isso). Baselines: workflow visual-update.yml.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    env:
      HOME: /root
      RTE_VISUAL_CONTAINER: '1'
      CI: '1'
      NX_DAEMON: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-visual-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-visual-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # O `serve-static` do app de teste depende do build (Nx); o webServer do Playwright o sobe.
      - run: npx playwright test -c e2e/visual
      # Capturas que passaram só na repetição viram aviso (O2).
      - name: Resumo do visual
        if: always()
        run: node tools/quality-summary.mjs --visual e2e/test-results/report-visual.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/visual/
            e2e/test-results/visual/
          retention-days: 14
          if-no-files-found: ignore

  # Demo (spec 07b, W14): consome os tarballs dos pacotes como um app externo (fora do repositório),
  # roda os unitários e o build do demo, confere os snippets do tema e executa o E2E J1–J8 nos 3
  # navegadores. Paralelo ao `verify`; sempre roda (sem `affected`).
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RTE_DEMO_PORT: 4318
    steps:
      - uses: actions/checkout@v4
      # O contexto `runner` não existe no `env` do job: o diretório do consumidor (fora do repositório) vai por GITHUB_ENV.
      - run: echo "RTE_CONSUMER_DIR=$RUNNER_TEMP/cds-rte-consumer/demo" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-demo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-demo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx nx run-many -t build -p core sanitizer theme angular render
      # Guarda de TDZ: cada fesm do dist avalia em Node puro (sem o dist, falha em vez de pular).
      - run: node --test tools/fesm-eval.test.mjs
        env:
          RTE_REQUIRE_DIST: '1'
      # pack -> prepare -> install (prova de origem dos tarballs) -> ng test -> ng build -> tsc dos snippets.
      - run: node tools/consumer.mjs pack prepare install test build check-snippets
      # Só no main: segundo build do demo, com a base da publicação (spec 07c, X10). O HTML
      # pré-renderizado sai em browser/cds-text-editor/demo/; flattenPrerender o sobe para a raiz.
      - name: Build do demo para o Pages (base /cds-text-editor/demo/)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ runner.temp }}/cds-rte-consumer/demo
        run: |
          node node_modules/@angular/cli/bin/ng.js build --base-href /cds-text-editor/demo/ --output-path dist/demo-pages
          node --input-type=module -e "const { flattenPrerender } = await import(process.env.GITHUB_WORKSPACE + '/tools/consumer.mjs'); console.log(flattenPrerender('dist/demo-pages/browser'));"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: demo-pages
          path: ${{ runner.temp }}/cds-rte-consumer/demo/dist/demo-pages/browser
          retention-days: 14
          if-no-files-found: error
      - run: npx playwright install --with-deps
      - run: npx playwright test -c apps/demo/e2e
      - uses: actions/upload-artifact@v4
        with:
          name: demo-static
          path: ${{ runner.temp }}/cds-rte-consumer/demo/dist/demo/browser
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-playwright-report
          path: |
            playwright-report/
            apps/demo/e2e/test-results/
          if-no-files-found: ignore
      - name: Árvore de dependências do consumidor
        if: failure()
        run: npm ls --all > "$RUNNER_TEMP/npm-ls.txt" 2>&1 || true
        working-directory: ${{ runner.temp }}/cds-rte-consumer/demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-npm-ls
          path: ${{ runner.temp }}/npm-ls.txt
          if-no-files-found: ignore

  # Regressão visual do demo (spec 08b, O5): só Chromium, no mesmo contêiner do job visual, sobre o
  # artefato demo-static que o job demo já provou (servido por apps/demo/serve.mjs, CSP estrita).
  # Baselines: workflow visual-update.yml (que reconstrói o demo).
  visual-demo:
    needs: demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    env:
      HOME: /root
      RTE_VISUAL_CONTAINER: '1'
      CI: '1'
      NX_DAEMON: 'false'
      RTE_DEMO_PORT: 4318
      RTE_DEMO_DIR: demo-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: demo-static
          path: demo-static
      - run: npx playwright test -c apps/demo/e2e/visual/playwright.config.ts --project=visual-demo-chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-demo-report
          path: |
            playwright-report/visual-demo/
            apps/demo/e2e/test-results/visual/
          retention-days: 14
          if-no-files-found: ignore

  # Site de documentação (spec 07c, X12): gera o modelo de API e o conteúdo, constrói o site como
  # consumidor dos tarballs (fora do repositório), confere os links internos e roda o E2E I1-I6
  # nos 3 navegadores sob o prefixo /cds-text-editor/. Paralelo ao `verify` e ao `demo`; sempre
  # roda. Sem orçamentos de desempenho aqui (runners do CI ~2x mais lentos; ADR 0016).
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RTE_DOCS_PORT: 4320
    steps:
      - uses: actions/checkout@v4
      - run: echo "RTE_CONSUMER_DIR=$RUNNER_TEMP/cds-rte-consumer/docs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-docs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-docs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-demo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npx nx run-many -t build -p core sanitizer theme angular render
      # Modelo de API (api-extractor com docModel; os relatórios api/*.api.md não mudam) e Markdown.
      - name: Modelo de API
        run: |
          export RTE_API_MODEL=dist/api-model
          node tools/api-report.mjs packages/core
          node tools/api-report.mjs packages/sanitizer
          node tools/api-report.mjs packages/theme
          node tools/api-report.mjs dist/packages/angular
          node tools/api-report.mjs dist/packages/render
      - run: npx api-documenter markdown -i dist/api-model -o dist/api-markdown
      - run: node tools/docs-content.mjs
      # pack -> prepare -> install (prova de origem dos tarballs) -> ng test (exemplos) -> ng build (estrito).
      - run: node tools/consumer.mjs --app docs pack prepare install test build
      - name: Links internos (site e READMEs) e lista dos externos
        run: node tools/check-links.mjs "$RTE_CONSUMER_DIR/dist/docs/browser" --base /cds-text-editor/ --readmes --externos links-externos.txt
      - run: npx playwright install --with-deps
      - run: npx playwright test -c apps/docs/e2e
      - uses: actions/upload-artifact@v4
        with:
          name: docs-static
          path: ${{ runner.temp }}/cds-rte-consumer/docs/dist/docs/browser
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: links-externos.txt
          path: links-externos.txt
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-playwright-report
          path: |
            playwright-report/
            apps/docs/test-results/
          if-no-files-found: ignore
      - name: Árvore de dependências do consumidor
        if: failure()
        run: npm ls --all > "$RUNNER_TEMP/npm-ls.txt" 2>&1 || true
        working-directory: ${{ runner.temp }}/cds-rte-consumer/docs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-npm-ls
          path: ${{ runner.temp }}/npm-ls.txt
          if-no-files-found: ignore

  # Publicação no GitHub Pages (spec 07c, X10): só em push para o main, depois dos três jobs, e só
  # com a variável RTE_PAGES = 'true' (o main não fica vermelho antes de o dono ligar o Pages).
  # TODO-AUTOR: ativar Pages com origem "GitHub Actions" (Settings > Pages) e criar a variável de
  # repositório RTE_PAGES = true; repositório privado exige plano pago (sem isso o site fica só
  # como os artefatos docs-static e demo-pages). Domínio próprio: CNAME e RTE_SITE_BASE=/ (TODO-AUTOR).
  pages:
    needs: [verify, demo, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RTE_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      RTE_DOCS_PORT: 4320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: docs-static
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: demo-pages
          path: site/demo
      - run: touch site/.nojekyll
      # Links internos do site montado, inclusive docs <-> demo.
      - run: node tools/check-links.mjs site --base /cds-text-editor/ --demo-root site/demo
      # O demo montado existe (os links docs <-> demo já foram conferidos acima).
      - run: test -s site/demo/index.html
      # Fumaça I1 (Chromium) sobre o site montado, servido sob o prefixo: uma página do guia e uma
      # de API (a suíte inteira já rodou no job docs; aqui só se confere a montagem sob o prefixo).
      - run: npx playwright install --with-deps chromium
      - run: |
          npx playwright test -c apps/docs/e2e --project=chromium i1-smoke -g '(guia/inicio-rapido|api/core): sem'
        env:
          RTE_DOCS_DIR: ${{ github.workspace }}/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
