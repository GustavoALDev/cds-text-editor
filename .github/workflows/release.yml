name: Release
# Só manual até a spec 09b (publicação a partir do `dist`, NPM_TOKEN e a opção do
# repositório que deixa o Actions abrir PRs). Depois volta a ser `push` em `main`.
on:
  workflow_dispatch:

# Versão independente por pacote: o changesets/action abre/atualiza o PR "Version Packages"
# e, quando ele é mesclado, publica com provenance. Nenhum token fica no repositório.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm i -g npm@11
      - run: npm ci
      - run: npx nx run-many -t build verify-package
      - uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset publish
          commit: 'chore(release): versões dos pacotes'
          title: 'chore(release): versões dos pacotes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Equivale a `npm publish --provenance` (também fixado em publishConfig de cada pacote).
          NPM_CONFIG_PROVENANCE: 'true'
