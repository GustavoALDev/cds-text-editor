<!-- #region template -->
<p>
  @for (p of presets; track p) {
  <button
    type="button"
    [attr.data-preset]="p"
    [attr.aria-pressed]="preset() === p"
    (click)="preset.set(p)"
  >
    {{ p }}
  </button>
  }
</p>
@for (setup of setups(); track setup.key) {
<rte-editor
  [(value)]="html"
  [toolbar]="preset()"
  [options]="setup.options"
  [labels]="labels"
  ariaLabel="Texto do exemplo da barra"
/>
}
<!-- #endregion -->
